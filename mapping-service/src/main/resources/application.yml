spring:
  application:
    name: pva-mapping-service
  # Suppress the Spring Boot web server — this is a background service only.
  main:
    web-application-type: none

# ──────────────────────────────────────────────────────────────────────────────
# PVA Mapping Service configuration
#
# Override or extend via --spring.config.import=file:./mapping.yml on the
# command line, or by setting SPRING_CONFIG_IMPORT in the environment.
#
# The example below is commented out.  Provide your own mapping.yml (or inline
# the pva-mapping block here) pointing at your actual service URLs.
# ──────────────────────────────────────────────────────────────────────────────

pva-mapping:
  poll-interval: PT10S   # global default; override per service with poll-interval:

